<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ancient Rhythm — Living Moon Wheel</title>
<meta name="description" content="An interactive daily companion for the 13-moon Ancient Rhythm year.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Italiana&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div class="nebula nebula-one"></div>
<div class="nebula nebula-two"></div>

<main class="app-shell">
  <header class="topbar">
    <a class="brand" href="#" id="brandHome" aria-label="Return to today">
      <span class="brand-moon">☾</span>
      <span>The Ancient Rhythm</span>
    </a>
    <p class="top-whisper">a living moon companion</p>
    <nav class="top-links" aria-label="Ancient Rhythm places">
      <button class="top-link" id="openCalendar" type="button">Full Calendar</button>
      <button class="top-link" id="openJournal" type="button">Journal</button>
    </nav>
  </header>

  <section class="stage">
    <div class="wheel-zone">
      <div class="moon-wheel" id="moonWheel" aria-label="Choose one of the thirteen moons">
        <div class="wheel-halo"></div>
        <div class="wheel-ring"></div>
        <button class="moon-core" id="moonCore" type="button" aria-label="Return to the current moon">
          <span class="core-symbol" id="coreSymbol">☾</span>
          <span class="core-day" id="coreDay">Today</span>
          <span class="core-name" id="coreName">Listening…</span>
        </button>
      </div>

      <button class="dot-star" id="dotStar" type="button">✦ Days Out of Time</button>

      <div class="travel-controls" aria-label="Move through the moons">
        <button class="travel-button" id="prevMoon" type="button">← Previous</button>
        <button class="travel-button return-button" id="returnToday" type="button">Return to Today</button>
        <button class="travel-button" id="nextMoon" type="button">Next →</button>
      </div>
    </div>

    <section class="oracle" id="oraclePanel" aria-live="polite">
      <p class="oracle-kicker" id="oracleKicker">The Ancient Rhythm</p>
      <h1 class="oracle-title" id="oracleTitle">Enter the Moon Wheel</h1>
      <p class="oracle-dates" id="oracleDates"></p>
      <div class="oracle-body" id="oracleBody"></div>
      <div class="oracle-actions" id="oracleActions"></div>
    </section>
  </section>

  <nav class="altar" aria-label="Choose an experience">
    <button class="altar-button is-active" type="button" data-view="today">
      <span class="altar-icon">☾</span><span>Today</span>
    </button>
    <button class="altar-button" type="button" data-view="wisdom">
      <span class="altar-icon">✦</span><span>Wisdom</span>
    </button>
    <button class="altar-button" type="button" data-view="ritual">
      <span class="altar-icon">♨</span><span>Practice</span>
    </button>
    <button class="altar-button" type="button" data-view="breath">
      <span class="altar-icon">◎</span><span>Breathe</span>
    </button>
    <button class="altar-button" type="button" data-view="garden">
      <span class="altar-icon">❧</span><span>Garden</span>
    </button>
    <button class="altar-button" type="button" data-view="card">
      <span class="altar-icon">✧</span><span>Reveal</span>
    </button>
    <button class="altar-button" type="button" id="openGuide">
      <span class="altar-icon">◐</span><span>Guide</span>
    </button>
  </nav>
</main>

<aside class="guide-drawer" id="guideDrawer" aria-hidden="true" aria-label="Moon Guide">
  <div class="guide-head">
    <div>
      <p class="guide-eyebrow">Ask gently</p>
      <h2>Moon Guide</h2>
    </div>
    <button class="guide-close" id="closeGuide" type="button" aria-label="Close Moon Guide">×</button>
  </div>

  <p class="guide-intro">Ask for wisdom, a ritual, an affirmation, a garden teaching, or what may be ready to release.</p>

  <div class="guide-chips">
    <button type="button" data-question="Teach me this moon's wisdom">Teach me</button>
    <button type="button" data-question="Give me a ritual for this moon">Ritual</button>
    <button type="button" data-question="I need an affirmation">Affirmation</button>
    <button type="button" data-question="What wants release in this moon?">Release</button>
    <button type="button" data-question="How should I tend the garden in this moon?">Garden</button>
  </div>

  <div class="chat-log" id="chatLog"></div>

  <form class="chat-form" id="chatForm">
    <input id="chatInput" type="text" placeholder="Ask the Moon Guide…" autocomplete="off">
    <button type="submit">Ask</button>
  </form>
</aside>
<div class="drawer-scrim" id="drawerScrim"></div>

<script src="app.js?v=5"></script>
</body>
</html>
